<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Report Libri da Consegnare</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 11px; background: #f5f5f5; color: #222; }

#toolbar {
  background: #1a3a5c; color: #fff;
  padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 10;
}
#toolbar strong { flex: 1; font-size: 14px; }
#toolbar button {
  background: #fff; color: #1a3a5c; border: none;
  padding: 6px 16px; border-radius: 4px; font-weight: 700;
  cursor: pointer; font-size: 12px;
}
#toolbar button:hover { background: #e2e8f0; }
#stato { font-size: 12px; opacity: .85; }

.pagina {
  width: 210mm;
  margin: 12px auto;
  background: #fff;
  padding: 12mm 14mm;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.intestazione {
  display: flex; align-items: center; gap: 8mm;
  border-bottom: 2px solid #1a3a5c; padding-bottom: 4mm; margin-bottom: 5mm;
}
.intestazione img { width: 30mm; height: auto; }
.intestazione .testo h1 { font-size: 15px; font-weight: 900; color: #1a3a5c; }
.intestazione .testo p { font-size: 10px; color: #666; margin-top: 1mm; }

.sommario {
  display: flex; gap: 6mm; margin-bottom: 5mm;
}
.stat-box {
  flex: 1; border: 1px solid #c6d4f0; border-radius: 4px;
  padding: 3mm 4mm; text-align: center; background: #f0f4ff;
}
.stat-box .val { font-size: 20px; font-weight: 900; color: #1a3a5c; }
.stat-box .lbl { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: .5px; }

table {
  width: 100%; border-collapse: collapse;
  font-size: 10px;
}
thead tr { background: #1a3a5c; color: #fff; }
thead th {
  padding: 4px 6px; text-align: left;
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
}
thead th.r { text-align: center; }
tbody tr:nth-child(even) { background: #f7f9fc; }
tbody tr { border-bottom: 1px solid #e2e8f0; }
tbody td { padding: 4px 6px; vertical-align: top; }
tbody td.isbn { font-family: monospace; font-size: 9px; color: #718096; white-space: nowrap; }
tbody td.titolo strong { font-size: 10px; display: block; }
tbody td.titolo span { font-size: 9px; color: #718096; }
tbody td.qty { text-align: center; font-weight: 900; font-size: 13px; color: #1a3a5c; white-space: nowrap; }
tbody td.clienti { font-size: 9.5px; color: #2d3748; }
.cliente-tag {
  display: inline-block;
  background: #e8f0fe; color: #1a3a5c;
  border-radius: 3px; padding: 1px 4px; margin: 1px 2px 1px 0;
  font-size: 9px; font-weight: 600; white-space: nowrap;
}
.n-cop {
  font-size: 8px; color: #553c9a; font-weight: 700;
}
.footer {
  margin-top: 6mm; border-top: 1px solid #e2e8f0;
  padding-top: 3mm; text-align: center;
  font-size: 8px; color: #999;
}

@media print {
  #toolbar { display: none !important; }
  body { background: #fff; }
  .pagina { margin: 0; box-shadow: none; width: 100%; padding: 8mm 10mm; }
  @page { size: A4; margin: 8mm; }
  tbody tr { page-break-inside: avoid; }
}
</style>
</head>
<body>

<div id="toolbar">
  <strong>📋 Report Libri da Consegnare</strong>
  <span id="stato">Caricamento…</span>
  <button onclick="window.print()">🖨️ Stampa / Salva PDF</button>
</div>

<div class="pagina" id="pagina" style="display:none">
  <div class="intestazione">
    <img src="Logo.png" alt="Pace e Bene"
      onerror="this.style.display='none'">
    <div class="testo">
      <h1>Libreria Pace e Bene — Alfa Srl</h1>
      <p>Report libri da consegnare ai clienti · Generato il <span id="data-gen"></span></p>
    </div>
  </div>

  <div class="sommario">
    <div class="stat-box"><div class="val" id="s-titoli">—</div><div class="lbl">Titoli</div></div>
    <div class="stat-box"><div class="val" id="s-copie">—</div><div class="lbl">Copie totali</div></div>
    <div class="stat-box"><div class="val" id="s-clienti">—</div><div class="lbl">Clienti coinvolti</div></div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:26mm">ISBN</th>
        <th>Titolo / Editore</th>
        <th class="r" style="width:12mm">Copie</th>
        <th style="width:90mm">Clienti</th>
      </tr>
    </thead>
    <tbody id="tb"></tbody>
  </table>

  <div class="footer">
    Libreria Pace e Bene — Alfa Srl &nbsp;·&nbsp; Report generato automaticamente
  </div>
</div>

<script>
const SB_URL = 'https://pzfgidqtxpnghkihwepd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6ZmdpZHF0eHBuZ2hraWh3ZXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MjUwNzIsImV4cCI6MjA5ODAwMTA3Mn0.uqwVWngmVdsQyrEF-BKpETA5o8xyMbza8I5lzQWzv8E';
const sb = supabase.createClient(SB_URL, SB_KEY);

async function carica() {
  const stato = document.getElementById('stato');

  const { data: righe, error: err } = await sb
    .from('righe_ordine')
    .select('isbn,titolo,editore,quantita,quantita_consegnata,ordini!inner(stato,clienti(nome,cognome))')
    .neq('ordini.stato', 'annullato');

  if (err) { stato.textContent = 'Errore: ' + err.message; return; }

  // Filtra non ancora consegnati
  const daCons = (righe||[]).filter(r =>
    (r.quantita_consegnata||0) < r.quantita
  );

  // Raggruppa per isbn
  const gruppi = {};
  daCons.forEach(r => {
    const key = r.isbn || r.titolo;
    if (!gruppi[key]) gruppi[key] = {
      isbn: r.isbn, titolo: r.titolo, editore: r.editore, totale: 0, clienti: []
    };
    const mancanti = r.quantita - (r.quantita_consegnata||0);
    gruppi[key].totale += mancanti;
    const c = r.ordini?.clienti;
    if (c) {
      gruppi[key].clienti.push({
        nome: [c.cognome, c.nome].filter(Boolean).join(' '),
        qty: mancanti
      });
    }
  });

  const lista = Object.values(gruppi).sort((a,b) => a.titolo.localeCompare(b.titolo,'it'));

  // Statistiche
  const totCopie = lista.reduce((s,g) => s + g.totale, 0);
  const tuttiClienti = new Set(daCons.map(r => r.ordini?.clienti?.cognome).filter(Boolean));
  document.getElementById('s-titoli').textContent = lista.length;
  document.getElementById('s-copie').textContent = totCopie;
  document.getElementById('s-clienti').textContent = tuttiClienti.size;
  document.getElementById('data-gen').textContent = new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

  // Tabella
  const tb = document.getElementById('tb');
  tb.innerHTML = lista.map((g,i) => {
    const clientiHtml = g.clienti
      .sort((a,b) => a.nome.localeCompare(b.nome,'it'))
      .map(c => `<span class="cliente-tag">${c.nome}${c.qty>1?' <span class="n-cop">(×'+c.qty+')</span>':''}</span>`)
      .join('');
    return `<tr>
      <td class="isbn">${g.isbn||'—'}</td>
      <td class="titolo"><strong>${g.titolo||'—'}</strong><span>${g.editore||''}</span></td>
      <td class="qty">${g.totale}</td>
      <td class="clienti">${clientiHtml}</td>
    </tr>`;
  }).join('');

  stato.textContent = `${lista.length} titoli · ${totCopie} copie`;
  document.getElementById('pagina').style.display = 'block';
}

carica();
</script>
</body>
</html>
