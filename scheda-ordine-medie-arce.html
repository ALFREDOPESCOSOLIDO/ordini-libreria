<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Scheda Raccolta Ordine — Medie Arce</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 11px; background: #fff; color: #000; }

.pagina {
  width: 210mm;
  min-height: 297mm;
  margin: 0 auto;
  padding: 8mm 10mm;
}

/* ── INTESTAZIONE ── */
.intestazione {
  display: flex;
  align-items: flex-start;
  gap: 6mm;
  margin-bottom: 4mm;
  border-bottom: 2px solid #003399;
  padding-bottom: 4mm;
}
.logo-wrap img { width: 36mm; height: auto; display: block; }
.logo-wrap .no-logo {
  width: 36mm; height: 18mm;
  border: 1px dashed #aaa;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #aaa; text-align: center;
}
.titolo-centro { flex: 1; text-align: center; padding-top: 2mm; }
.titolo-centro h1 { font-size: 14px; font-weight: 900; color: #003399; text-transform: uppercase; letter-spacing: 1px; }
.titolo-centro h2 { font-size: 10px; font-weight: 600; color: #444; margin-top: 1mm; }
.titolo-centro .sub { margin-top: 1mm; font-size: 9px; color: #777; }
.dati-header { flex: 0 0 auto; display: flex; flex-direction: column; gap: 3mm; padding-top: 2mm; min-width: 52mm; }
.campo-header { display: flex; align-items: center; gap: 2mm; font-size: 10px; font-weight: 700; }
.campo-header .linea { flex: 1; border-bottom: 1px solid #000; height: 4mm; }
.foderatura-box {
  border: 2px solid #553c9a; border-radius: 4px;
  padding: 2mm 3mm; display: flex; align-items: center; gap: 2mm; background: #f3e8ff;
}
.foderatura-box .quadratino { width: 5mm; height: 5mm; border: 2px solid #553c9a; flex-shrink: 0; }
.foderatura-box span { font-size: 10px; font-weight: 900; color: #553c9a; text-transform: uppercase; letter-spacing: .5px; }

/* ── DATI ALUNNO ── */
.sezione-dati { border: 1px solid #003399; border-radius: 4px; padding: 3mm 4mm; margin-bottom: 3mm; }
.titolo-sezione-blu { font-size: 10px; font-weight: 900; color: #003399; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2.5mm; border-bottom: 1px solid #c6d4f0; padding-bottom: 1mm; }
.titolo-sezione-verde { font-size: 10px; font-weight: 900; color: #276749; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2.5mm; border-bottom: 1px solid #c6f6d5; padding-bottom: 1mm; }
.griglia-3 { display: grid; grid-template-columns: 2fr 1fr 1.5fr; gap: 2mm 5mm; }
.campo-dato { display: flex; align-items: flex-end; gap: 1.5mm; font-size: 10px; font-weight: 700; }
.campo-dato .linea { flex: 1; border-bottom: 1px solid #555; height: 4mm; }

/* ── PAGAMENTI ── */
.sezione-pag { border: 1px solid #276749; border-radius: 4px; padding: 3mm 4mm; margin-bottom: 3mm; }
.griglia-pag { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2mm 5mm; }
.campo-pag { display: flex; flex-direction: column; gap: 1mm; font-size: 10px; font-weight: 700; }
.campo-pag .linea { border-bottom: 1.5px solid #555; height: 4.5mm; }
.campo-pag.acconto .linea { border-bottom: 2px solid #276749; }

/* ── LIBRI ── */
.classe-header { background: #003399; color: #fff; font-size: 11px; font-weight: 900; padding: 1.5mm 3mm; text-transform: uppercase; letter-spacing: .5px; }
.libri-table { width: 100%; border-collapse: collapse; }
.libri-table th { background: #e8edf8; font-size: 9px; font-weight: 900; text-transform: uppercase; color: #003399; padding: 1.5mm 2mm; border-bottom: 1px solid #c6d4f0; }
.libri-table th.r { text-align: right; }
.libri-table td { padding: 1.5mm 2mm; border-bottom: 1px solid #e2e8f0; vertical-align: middle; font-size: 10px; }
.libri-table tr:last-child td { border-bottom: none; }
.libri-table td.c { text-align: center; }
.libri-table td.r { text-align: right; font-weight: 700; color: #276749; }
.quadratino-ord { width: 5mm; height: 5mm; border: 1.5px solid #555; display: inline-block; }
.mat { font-size: 8px; color: #718096; display: block; }
.tit { font-weight: 700; font-size: 10px; display: block; line-height: 1.2; }
.aut { font-size: 8px; color: #718096; display: block; }
.riga-tot { display: flex; justify-content: flex-end; align-items: center; gap: 4mm; padding: 2mm 3mm; background: #f0f4ff; border-top: 2px solid #003399; font-size: 11px; font-weight: 900; }
.riga-tot .imp { font-size: 13px; color: #276749; }

/* ── NOTE ── */
.sezione-note { border: 1px solid #aaa; border-radius: 4px; padding: 3mm 4mm; margin-bottom: 3mm; }
.titolo-note { font-size: 10px; font-weight: 900; color: #555; text-transform: uppercase; margin-bottom: 2mm; }
.riga-note { border-bottom: 1px solid #ccc; height: 4mm; margin-bottom: 3mm; }

/* ── TOOLBAR (non stampa) ── */
#toolbar {
  background: #003399; color: #fff; padding: 8px 16px;
  display: flex; align-items: center; gap: 12px; font-size: 13px;
}
#toolbar strong { flex: 1; }
#toolbar select { padding: 4px 8px; border-radius: 4px; border: none; font-size: 12px; }
#toolbar button { background: #fff; color: #003399; border: none; padding: 4px 14px; font-weight: 700; border-radius: 4px; cursor: pointer; font-size: 12px; }

@media print {
  #toolbar { display: none !important; }
  .pagina { padding: 5mm 8mm; }
  @page { size: A4; margin: 5mm; }
}
</style>
</head>
<body>

<div id="toolbar">
  <strong>📝 Scheda Raccolta Ordine — Medie Arce</strong>
  <label style="font-size:12px">Classe:</label>
  <select id="sel-classe" onchange="renderScheda()"><option value="">Tutte le classi</option></select>
  <button onclick="window.print()">🖨️ Stampa</button>
</div>

<div id="loading" style="text-align:center;padding:20mm;font-size:14px;color:#666">Caricamento libri…</div>
<div id="contenuto" style="display:none"></div>

<script>
const SB_URL = 'https://pzfgidqtxpnghkihwepd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6ZmdpZHF0eHBuZ2hraWh3ZXBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MjUwNzIsImV4cCI6MjA5ODAwMTA3Mn0.uqwVWngmVdsQyrEF-BKpETA5o8xyMbza8I5lzQWzv8E';
const sb = supabase.createClient(SB_URL, SB_KEY);
const fmt = v => v != null ? Number(v).toFixed(2).replace('.', ',') : '—';

let _tuttiLibri = [];

async function carica() {
  const { data, error } = await sb
    .from('catalogo_libri')
    .select('*')
    .eq('tipo_scuola', 'medie')
    .order('sort_order', { ascending: true, nullsFirst: false })
    .order('materia');

  if (error) {
    document.getElementById('loading').innerHTML = `<div style="color:red;padding:10mm">Errore: ${error.message}</div>`;
    return;
  }

  // Solo libri da acquistare
  _tuttiLibri = (data || []).filter(b => b.da_acquistare !== false);

  // Popola selettore anni (1, 2, 3)
  const tuttiAnni = [...new Set(_tuttiLibri.flatMap(b => (b.classi||[]).map(c => c.match(/^(\d)/)?.[1]).filter(Boolean)))].sort();
  const sel = document.getElementById('sel-classe');
  tuttiAnni.forEach(a => {
    const o = document.createElement('option');
    o.value = a; o.textContent = `Anno ${a}`;
    sel.appendChild(o);
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('contenuto').style.display = 'block';
  renderScheda();
}

function sezioni(classi, anno) {
  // Estrae le lettere di sezione per un dato anno: ["1A","1B","2A"] → anno=1 → "A, B"
  return (classi||[])
    .filter(c => c.match(/^(\d)/)?.[1] === anno)
    .map(c => c.replace(/^\d+/,'').trim())
    .filter(Boolean)
    .sort()
    .join(', ') || 'Tutte';
}

function renderScheda() {
  const annoSel = document.getElementById('sel-classe').value;

  // Raggruppa per anno (1, 2, 3)
  const gruppiAnno = {}; // anno → [libri]
  _tuttiLibri.forEach(b => {
    const anni = [...new Set((b.classi||[]).map(c => c.match(/^(\d)/)?.[1]).filter(Boolean))];
    anni.forEach(a => {
      if (annoSel && a !== annoSel) return;
      if (!gruppiAnno[a]) gruppiAnno[a] = [];
      if (!gruppiAnno[a].find(x => x.id === b.id)) gruppiAnno[a].push(b);
    });
  });

  const anniOrdinati = Object.keys(gruppiAnno).sort();

  let libriHtml = '';
  if (!anniOrdinati.length) {
    libriHtml = `<div style="padding:5mm;color:#c00;font-weight:700">Nessun libro trovato. Verificare tipo_scuola='medie' nel catalogo.</div>`;
  } else {
    anniOrdinati.forEach(anno => {
      const bks = gruppiAnno[anno];
      const tot = bks.reduce((s,b) => s + (b.prezzo||0), 0);
      libriHtml += `
      <div style="border:1px solid #555;border-radius:4px;overflow:hidden;margin-bottom:3mm">
        <div class="classe-header">Classe ${anno}ª</div>
        <table class="libri-table">
          <thead><tr>
            <th style="width:8mm;text-align:center">Ord.</th>
            <th style="width:20mm;text-align:center">Sezioni</th>
            <th style="width:22mm">ISBN</th>
            <th>Libro</th>
            <th style="width:16mm" class="r">Prezzo</th>
          </tr></thead>
          <tbody>
            ${bks.map(b => `<tr>
              <td class="c"><div class="quadratino-ord"></div></td>
              <td class="c" style="font-size:9px;font-weight:700;color:#003399">${sezioni(b.classi, anno)}</td>
              <td style="font-size:8px;font-family:monospace;color:#777">${b.isbn||'—'}</td>
              <td>
                <span class="mat">${b.materia||''}${b.volume?' · Vol.'+b.volume:''}</span>
                <span class="tit">${b.titolo||'—'}</span>
                <span class="aut">${[b.autore,b.editore].filter(Boolean).join(' · ')}</span>
              </td>
              <td class="r">€ ${fmt(b.prezzo)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div class="riga-tot"><span>Totale ${anno}ª classe</span><span class="imp">€ ${fmt(tot)}</span></div>
      </div>`;
    });
  }

  const nomeClasse = annoSel ? `— Classe ${annoSel}ª` : '';

  document.getElementById('contenuto').innerHTML = `
  <div class="pagina">
    <div class="intestazione">
      <div class="logo-wrap">
        <img src="Logo.png" alt="Pace e Bene"
          onerror="this.outerHTML='<div class=\\'no-logo\\'>Pace e Bene<br>Alfa Srl</div>'">
      </div>
      <div class="titolo-centro">
        <h1>Scheda Raccolta Ordine</h1>
        <h2>Scuola Media — Arce ${nomeClasse}</h2>
        <div class="sub">Compilare a stampatello — consegnare in libreria</div>
      </div>
      <div class="dati-header">
        <div class="campo-header">Data <div class="linea"></div></div>
        <div class="foderatura-box">
          <div class="quadratino"></div>
          <span>📚 Servizio Foderine</span>
        </div>
      </div>
    </div>

    <div class="sezione-dati">
      <div class="titolo-sezione-blu">Dati Alunno</div>
      <div class="griglia-3">
        <div class="campo-dato">Cognome <div class="linea"></div></div>
        <div class="campo-dato">Sezione <div class="linea"></div></div>
        <div class="campo-dato">Cellulare <div class="linea"></div></div>
        <div class="campo-dato">Nome <div class="linea"></div></div>
        <div class="campo-dato">Classe <div class="linea"></div></div>
        <div class="campo-dato">Email <div class="linea"></div></div>
      </div>
    </div>

    <div class="sezione-pag">
      <div class="titolo-sezione-verde">Pagamenti</div>
      <div class="griglia-pag">
        <div class="campo-pag acconto"><div>Acconto €</div><div class="linea"></div></div>
        <div class="campo-pag"><div>Pagamento 1 €</div><div class="linea"></div></div>
        <div class="campo-pag"><div>Pagamento 2 €</div><div class="linea"></div></div>
        <div class="campo-pag"><div>Pagamento 3 €</div><div class="linea"></div></div>
        <div class="campo-pag"><div>Pagamento 4 €</div><div class="linea"></div></div>
      </div>
    </div>

    ${libriHtml}

    <div class="sezione-note">
      <div class="titolo-note">Note</div>
      <div class="riga-note"></div>
      <div class="riga-note"></div>
    </div>

    <div style="text-align:center;font-size:8px;color:#999;margin-top:3mm">
      Libreria Pace e Bene — Alfa Srl &nbsp;·&nbsp; Scheda generata automaticamente dal catalogo
    </div>
  </div>`;
}

carica();
</script>
</body>
</html>
